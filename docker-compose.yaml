services:
  nest:
    container_name: app
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PASSWORD: secret
    ports:
      - 3000:3000
    depends_on:
      - db
      - redis

  db:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432

  redis:
    container_name: redis
    image: redis:latest
    command: redis-server --requirepass secret
    environment:
      REDIS_PASSWORD: secret
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

